<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MediNexus – Sign in</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="relative min-h-screen overflow-x-hidden bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">
    <!-- animated background blobs -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div class="animate-blob absolute -left-24 -top-24 h-96 w-96 rounded-full bg-teal-300/50 blur-3xl dark:bg-teal-500/20"></div>
      <div class="animate-blob [animation-delay:-6s] absolute -right-24 top-1/3 h-96 w-96 rounded-full bg-cyan-300/50 blur-3xl dark:bg-cyan-500/20"></div>
      <div class="animate-blob [animation-delay:-12s] absolute -bottom-32 left-1/4 h-96 w-96 rounded-full bg-emerald-300/50 blur-3xl dark:bg-emerald-500/20"></div>
    </div>

    <main class="grid min-h-screen place-items-center px-4 py-10">
      <div class="animate-rise w-full max-w-md rounded-3xl border border-white/60 bg-white/80 p-7 shadow-2xl shadow-teal-900/10 backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/70">
        <!-- brand -->
        <div class="mb-7 flex items-center gap-3">
          <div class="animate-pulse-ring grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-teal-400 to-cyan-600 text-white">
            <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight">MediNexus</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Healthcare, connected.</p>
          </div>
        </div>

        <!-- login -->
        <section id="loginView" class="animate-fade">
          <h2 class="text-lg font-semibold">Welcome back</h2>
          <p class="mb-5 mt-1 text-sm text-slate-500 dark:text-slate-400">Sign in with your Google account to continue.</p>
          <div id="googleBtn" class="flex min-h-11 justify-center transition-transform duration-200 hover:scale-[1.03]"></div>
        </section>

        <!-- user -->
        <section id="userView" hidden>
          <div class="animate-pop flex items-center gap-4">
            <img id="avatar" alt="" referrerpolicy="no-referrer" class="h-16 w-16 rounded-full border-2 border-teal-500 bg-slate-100 object-cover dark:bg-slate-800" />
            <div class="min-w-0">
              <strong id="uName" class="block truncate"></strong>
              <span id="uEmail" class="block truncate text-sm text-slate-500 dark:text-slate-400"></span>
              <span id="uRole" class="mt-1.5 inline-block rounded-full bg-teal-500/15 px-3 py-0.5 text-xs font-semibold text-teal-700 dark:text-teal-300"></span>
            </div>
          </div>
          <button id="logout" type="button" class="mt-5 w-full rounded-xl border border-slate-300 py-2.5 text-sm font-semibold transition hover:border-teal-500 hover:text-teal-600 active:scale-95 dark:border-slate-700 dark:hover:text-teal-300">Sign out</button>
        </section>

        <!-- tokens -->
        <section class="mt-7 border-t border-dashed border-slate-300 pt-5 dark:border-slate-700">
          <label for="googleToken" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Google ID token</label>
          <div class="relative">
            <textarea id="googleToken" readonly rows="4" placeholder="Your Google ID token will appear here after login" class="token-box"></textarea>
            <button type="button" data-copy="googleToken" class="copy-btn">Copy</button>
          </div>

          <label for="accessToken" class="mb-1.5 mt-4 block text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">MediNexus access token (backend)</label>
          <div class="relative">
            <textarea id="accessToken" readonly rows="3" placeholder="Backend JWT will appear here" class="token-box"></textarea>
            <button type="button" data-copy="accessToken" class="copy-btn">Copy</button>
          </div>

          <p id="status" role="status" class="mt-4 min-h-5 text-sm text-slate-500 dark:text-slate-400"></p>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
